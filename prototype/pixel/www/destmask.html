<!doctype html>
<meta charset="utf-8">
<title>Trailhead destination areas</title>
<!-- A check, not part of the game: each destination's country (D12b) over a grey map. Blue Reflection Lake,
     orange Proficiency Peak, red the Spires; the landmark itself is the brighter shade. -->
<style>body { margin: 0; background: #000 } canvas { display: block }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { LAND } from './land.js';
const x = document.getElementById('c').getContext('2d'), d = x.createImageData(1920, 1080), COL = [null, [60, 120, 255], [255, 150, 0], [255, 40, 40]];
LAND.dest.forEach((k, i) => {
  const s = (LAND.g[i] % 7) * 8;
  d.data.set(k ? COL[k & 3].map(v => v * (k & 4 ? 1 : 0.55)).concat(255) : LAND.depth[i] < 1e8 ? [70 + s, 85 + s, 70 + s, 255] : [160, 190, 230, 255], i * 4);
});
x.putImageData(d, 0, 0); window.__ready = true;
</script>
