name: PR Checks

# Everything a PR must pass besides `PR Title` and `Lint` (their own
# workflows). Each job runs a `make` target, so a red check reruns locally the
# same way, in Docker (docs/DEVELOPMENT.md).
#
# Branch protection requires these jobs by name; renaming one strands PRs on
# a check that never reports. docs/CICD.md lists them.
on:
  pull_request:
    branches:
      - main

# A newer push replaces the run for the older one.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ESLint and its rules' self-test, then tsc, then the committed OpenAPI
      # document against the routes it's written from.
      - run: make lint
      - run: make typecheck
      - run: make check-openapi

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      pull-requests: write # the sticky coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      # Line and branch coverage with no floor (project.md, Tests): the table
      # goes on the PR and in the run's summary, so a gap is seen.
      - run: bash scripts/coverage-table.sh coverage/unit/coverage-summary.json "Unit test coverage" | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-unit
          path: coverage.md

  database:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      pull-requests: write # the sticky coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SQL against a throwaway Postgres the target starts and removes.
      - run: make test-db
      - run: bash scripts/coverage-table.sh coverage/db/coverage-summary.json "Database test coverage" | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-db
          path: coverage.md

  # The four images, each as yggdrasil's docker-build module would check it:
  # hadolint, the linux/amd64 build, the smoke test, a Trivy table on the PR,
  # and a failure on any fixable Critical or High. A job of the repo's own
  # because the module builds only `<context>/Dockerfile`, and every image
  # here builds from the repo root with its Dockerfile in its folder
  # (record 0009).
  image:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      pull-requests: write # the sticky scan comment
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, admin, fetcher]
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: trailhead-${{ matrix.service }}:pr-scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
      - run: make image
      - name: Smoke test the built image
        run: make smoke
      - name: Report the image size
        run: echo "**${IMAGE}**: $(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec) uncompressed" >> "$GITHUB_STEP_SUMMARY"
      # Fixable only: distributions ship CVEs upstream hasn't patched, which
      # nobody can act on. Every severity, for the comment.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          output: trivy.txt
          ignore-unfixed: true
      - name: Write the scan comment
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### Image vulnerability scan: trailhead-${SERVICE}"
            echo ""
            echo "Trivy on this PR's image at \`${PR_SHA}\` (linux/amd64, fixable only). Critical and High fail this check, and the release would refuse them too."
            echo ""
            echo '```text'
            cat trivy.txt
            echo '```'
          } > scan-comment.md
          cat scan-comment.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: image-scan-${{ matrix.service }}
          path: scan-comment.md
      - name: Fail on fixable Critical or High vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      # The browser and Lighthouse jobs load this image rather than build it
      # again.
      - if: matrix.service == 'web'
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/web-image.tar"
      - if: matrix.service == 'web'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-image
          path: ${{ runner.temp }}/web-image.tar
          retention-days: 1
          compression-level: 1

  browser:
    name: Browser Smoke & Axe
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-image
      - run: docker load -i web-image.tar
      - run: make browser-run
      # A trace and a screenshot of every failed test, so a red run can be
      # read rather than guessed at.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse Budgets
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-image
      - run: docker load -i web-image.tar
      # The budgets and their measurements live in .github/lighthouserc.json
      # and docs/LIMITS.md.
      - run: make lighthouse-run

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docker-compose.yml brought up as a developer would, then checked from
      # outside. The fetcher stays down: it would call GitHub.
      - run: make compose-smoke
