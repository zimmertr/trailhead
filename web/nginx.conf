# The web image's whole nginx configuration. Everything nginx writes goes
# under /tmp, so the container runs with a read-only root filesystem and one
# writable /tmp (an emptyDir in the chart, a tmpfs in compose).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # One JSON line per request, with the path but no query string and no
    # client address (project.md, Health and logs).
    log_format json escape=json '{"time":"$time_iso8601","service":"web","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time}';
    access_log /dev/stdout json;

    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # Static files take no body. docs/LIMITS.md.
    client_max_body_size 1k;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Behind the gateway the Host and port nginx sees aren't the visitor's,
        # so a redirect (/page to /page/) keeps to the path.
        absolute_redirect off;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location = /version.json {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # Vite puts a content hash in every asset name, so a file here never
        # changes and can be cached for good.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
