name: PR Checks

# Everything a PR must pass besides `PR Title` and `Lint` (their own
# workflows). Each job runs a `make` target, so a red check reruns locally the
# same way, in Docker (docs/DEVELOPMENT.md).
#
# Branch protection requires these jobs by name; renaming one strands PRs on
# a check that never reports. docs/CICD.md lists them.
on:
  pull_request:
    branches:
      - main

# A newer push replaces the run for the older one.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ESLint and its rules' self-test, then tsc, then the committed OpenAPI
      # document against the routes it's written from.
      - run: make lint
      - run: make typecheck
      - run: make check-openapi

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      pull-requests: write # the sticky coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      # Line and branch coverage with no floor (project.md, Tests): the table
      # goes on the PR and in the run's summary, so a gap is seen.
      - run: bash scripts/coverage-table.sh coverage/unit/coverage-summary.json "Unit test coverage" | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: zimmertr/yggdrasil/actions/sticky-comment@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
        with:
          header: coverage-unit
          path: coverage.md

  database:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
      pull-requests: write # the sticky coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SQL against a throwaway Postgres the target starts and removes.
      - run: make test-db
      - run: bash scripts/coverage-table.sh coverage/db/coverage-summary.json "Database test coverage" | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: zimmertr/yggdrasil/actions/sticky-comment@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
        with:
          header: coverage-db
          path: coverage.md

  # yggdrasil's docker-build module, one matrix job per image: hadolint, the
  # linux/amd64 build, a sticky Trivy comment, and a failure on any fixable
  # Critical or High. The list is the release's, so each builds from the repo
  # root with its Dockerfile in its folder (record 0012). Each image is saved
  # as the artifact `trailhead-<service>-image` for the jobs below.
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      contents: read
      pull-requests: write # the sticky scan comments
    with:
      images: >-
        [{"image": "zimmertr/trailhead-web", "file": "web/Dockerfile"},
         {"image": "zimmertr/trailhead-api", "file": "api/Dockerfile"},
         {"image": "zimmertr/trailhead-admin", "file": "admin/Dockerfile"},
         {"image": "zimmertr/trailhead-fetcher", "file": "fetcher/Dockerfile"}]
      # As `make image` passes them, so the smoke tests read the same values.
      build-args: |
        APP_VERSION=0.0.0-ci
        APP_COMMIT=${{ github.event.pull_request.head.sha }}
        APP_BUILT_AT=1970-01-01T00:00:00Z
      upload-image: true

  # What only a running image shows, which container-structure-test can't
  # hold: scripts/smoke/<service>.sh starts the image docker-build saved and
  # checks it from outside (record 0012).
  smoke:
    name: Smoke (${{ matrix.service }})
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, admin, fetcher]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trailhead-${{ matrix.service }}-image
      - run: docker load -i "trailhead-${SERVICE}-image.tar"
        env:
          SERVICE: ${{ matrix.service }}
      - run: make smoke SERVICE="$SERVICE"
        env:
          SERVICE: ${{ matrix.service }}

  # yggdrasil's dependency-review module: fails a PR that adds a package
  # version with a known High or Critical vulnerability.
  dependency-review:
    name: Dependency Review
    uses: zimmertr/yggdrasil/.github/workflows/dependency-review.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      contents: read

  browser:
    name: Browser Smoke & Axe
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trailhead-web-image
      - run: docker load -i trailhead-web-image.tar
      - run: make browser-run
      # A trace and a screenshot of every failed test, so a red run can be
      # read rather than guessed at.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # yggdrasil's lighthouse module: the budgets in .github/lighthouserc.json,
  # measured in docs/LIMITS.md, against the web image docker-build saved,
  # served on 8080. Its reports land in the run's artifacts, pass or fail, so
  # a budget can be moved on a measurement rather than guessed at.
  lighthouse:
    name: Lighthouse
    needs: docker-build
    uses: zimmertr/yggdrasil/.github/workflows/lighthouse.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      contents: read
    with:
      image: zimmertr/trailhead-web
      config: .github/lighthouserc.json
      port: 8080
      health-path: /healthz

  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docker-compose.yml brought up as a developer would, then checked from
      # outside. The fetcher stays down: it would call GitHub.
      - run: make compose-smoke
