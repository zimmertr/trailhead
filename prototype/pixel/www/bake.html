<!doctype html>
<meta charset="utf-8">
<title>Trailhead ground bake</title>
<!-- Opened only by bake.sh: works the land out in full (land.js) and hands over the ground picture, the
     depth of every screen pixel (two bytes, in 64ths of a pixel) and what it is made of, one plane under
     the other, to be written to ground.png. -->
<script type="module">
import { LAND, NW, NH as SH } from './land.js';
const n = NW * SH, all = new Uint8Array(n * 4);
all.set(LAND.g, 0); all.set(LAND.mat, 3 * n);
for (let i = 0; i < n; i++) { const d = LAND.depth[i], q = d >= 1e8 ? 65535 : Math.min(65534, Math.round(d * 64)); all[n + i] = q >> 8; all[2 * n + i] = q & 255; }
let s = ''; for (let i = 0; i < all.length; i += 32768) s += String.fromCharCode.apply(null, all.subarray(i, i + 32768));
window.__bake = { w: NW, h: SH * 4, data: btoa(s) }; window.__ready = true;
</script>
