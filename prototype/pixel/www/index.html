<title>Trailhead Pixel MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Silkscreen&family=Tiny5&display=swap">
<style>
/* The world fills the screen at whole-pixel scale. Everything on top of it is trail furniture:
   routed wooden signs for anything you press, paper placards for anything you read. Lines are
   one world pixel thick (--px) and in the same ink as the sprites' outlines, so the page and the
   world read as one drawing. */
:root {
  --px: 3px;
  --ink: #1a1424;
  --paper: #f7f1dc;
  --paper-2: #e6dcbc;
  --paper-ink: #2c2030;
  --dim: #6e5f5a;
  --wood-1: #38220f;
  --wood-2: #5c3a20;
  --wood-3: #845638;
  --wood-4: #ac7a4e;
  --routed: #f8ebb8;
  --blaze: #e05824;
  --sun: #f4d048;
  --moss: #467a30;
  --tarn: #1a7688;
  --lcd: #9cbc3e;
  --shade: rgba(26, 20, 36, .38);
  /* Three pixel faces, each at a whole multiple of its own grid so no stroke lands between pixels:
     Jersey 15 for titles (30px), Jersey 10 for reading (20px), Tiny5 for small print (15px), and
     Silkscreen for anything routed into wood (16px). */
  --title: 'Jersey 15', 'Jersey 10', 'Courier New', monospace;
  --read: 'Jersey 10', 'Courier New', monospace;
  --small: 'Tiny5', 'Jersey 10', 'Courier New', monospace;
  --sign: 'Silkscreen', 'Courier New', monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #88aee6; color: var(--paper-ink); font-family: var(--read); font-size: 20px; line-height: 1.12; font-weight: 400; overflow: hidden; -webkit-font-smoothing: none; }
canvas#c { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
a { color: inherit; }
:focus-visible { outline: var(--px) solid var(--sun); outline-offset: var(--px); }
h1, h2, h3, h4, p, ul, dl, dd { margin: 0; padding: 0; }
h1, h2, h3, h4, b { font-family: var(--title); font-weight: 400; }
ul { list-style: none; }

/* Wood: a plank with grain, a lit top edge and routed lettering. */
.plank {
  position: relative; display: flex; align-items: center; gap: calc(var(--px) * 3);
  padding: calc(var(--px) * 2) calc(var(--px) * 4); min-height: calc(var(--px) * 11);
  font-family: var(--sign); font-size: 16px; line-height: 1.15; color: var(--routed); text-shadow: 0 var(--px) 0 var(--wood-1);
  background: repeating-linear-gradient(0deg, rgba(56, 34, 15, 0) 0 calc(var(--px) * 3), rgba(56, 34, 15, .28) calc(var(--px) * 3) calc(var(--px) * 4)), var(--wood-3);
  border: var(--px) solid var(--ink);
  box-shadow: inset 0 var(--px) 0 var(--wood-4), inset 0 calc(var(--px) * -1) 0 var(--wood-2), var(--px) calc(var(--px) * 2) 0 var(--shade);
}
button.plank:hover, a.plank:hover, .plank.on { background-color: var(--wood-4); }
button.plank:active { transform: translateY(var(--px)); box-shadow: inset 0 var(--px) 0 var(--wood-4), inset 0 calc(var(--px) * -1) 0 var(--wood-2); }
.plank small { font-family: var(--small); font-size: 15px; color: #ecd6a2; text-shadow: none; margin-left: auto; white-space: nowrap; }
.plank .where { display: block; font-family: var(--read); font-size: 20px; line-height: 1; color: #ecd6a2; text-shadow: none; }
/* A pixel arrow routed into the wood. */
.arrow { flex: none; width: calc(var(--px) * 7); height: calc(var(--px) * 5); background: var(--routed); clip-path: polygon(28.57% 0, 42.86% 0, 42.86% 40%, 100% 40%, 100% 60%, 42.86% 60%, 42.86% 100%, 28.57% 100%, 28.57% 80%, 14.29% 80%, 14.29% 60%, 0 60%, 0 40%, 14.29% 40%, 14.29% 20%, 28.57% 20%); }
.arrow.right { transform: scaleX(-1); }
.arrow.up { transform: rotate(90deg); }
.arrow.go { width: calc(var(--px) * 5); }
.arrow.go { clip-path: polygon(0 0, 20% 0, 20% 20%, 60% 20%, 60% 40%, 100% 40%, 100% 60%, 60% 60%, 60% 80%, 20% 80%, 20% 100%, 0 100%); background: var(--sun); }
.note { flex: none; width: calc(var(--px) * 5); height: calc(var(--px) * 5); background: var(--routed); clip-path: polygon(40% 0, 80% 0, 80% 20%, 100% 20%, 100% 40%, 80% 40%, 80% 20%, 60% 20%, 60% 100%, 0 100%, 0 60%, 40% 60%); }
.choice:hover .arrow, .choice:focus-visible .arrow { background: var(--sun); }

/* Paper: a placard pinned at its corners. */
.placard {
  position: relative; background: var(--paper); border: var(--px) solid var(--ink);
  box-shadow: inset 0 0 0 var(--px) var(--paper), inset 0 0 0 calc(var(--px) * 2) var(--paper-2), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--shade);
  padding: calc(var(--px) * 5) calc(var(--px) * 6);
}
.placard h1, .placard h2 { line-height: 1; }
.placard h1 { font-size: 30px; }
.placard h2 { font-size: 30px; }
.placard p { max-width: 36em; }
.rule { height: var(--px); background: repeating-linear-gradient(90deg, var(--paper-ink) 0 calc(var(--px) * 2), transparent calc(var(--px) * 2) calc(var(--px) * 4)); opacity: .55; }

#fork, #card { position: fixed; z-index: 2; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(var(--px) * 38 + env(safe-area-inset-bottom, 0px)); width: min(456px, calc(100% - 36px)); display: flex; flex-direction: column; gap: calc(var(--px) * 3); }
/* The junction sign: the placard on top, three planks under it on one post. */
#fork { background: none; border: 0; box-shadow: none; padding: 0; gap: 0; }
#fork .placard { display: flex; flex-direction: column; gap: calc(var(--px) * 2); z-index: 1; }
.post { position: relative; display: flex; flex-direction: column; gap: calc(var(--px) * 1); padding: calc(var(--px) * 2) 0 0; }
.post::before { content: ""; position: absolute; left: calc(var(--px) * 8); top: calc(var(--px) * -2); bottom: 0; width: calc(var(--px) * 4); background: var(--wood-2); border: var(--px) solid var(--ink); border-top: 0; box-shadow: inset var(--px) 0 0 var(--wood-3); }
.post .plank { width: 100%; }
#signs::before { bottom: calc(var(--px) * -36); }
#signs li:nth-child(1) .plank { margin-left: calc(var(--px) * -2); }
#signs li:nth-child(3) .plank { margin-left: calc(var(--px) * 3); width: calc(100% - var(--px) * 3); }

/* The card. Where it came from decides its paper. */
#card { padding: calc(var(--px) * 5) calc(var(--px) * 6) calc(var(--px) * 4); max-height: calc(100% - var(--px) * 54); overflow: auto; }
.from { font-family: var(--small); font-size: 15px; color: var(--dim); display: flex; align-items: center; gap: calc(var(--px) * 2); }
.from::before { content: ""; width: calc(var(--px) * 3); height: calc(var(--px) * 3); background: var(--blaze); box-shadow: 0 0 0 var(--px) var(--ink); margin: var(--px); }
#card-body { display: flex; flex-direction: column; gap: calc(var(--px) * 2); }
.aside { color: var(--dim); }
.draft { font-family: var(--small); font-size: 15px; color: var(--dim); align-self: flex-start; padding: 0 calc(var(--px) * 2); border: var(--px) dashed var(--dim); }
.tools, .links { display: flex; flex-wrap: wrap; gap: calc(var(--px) * 2); }
.tools li { font-family: var(--small); font-size: 15px; padding: 0 calc(var(--px) * 2); border: var(--px) solid var(--paper-ink); background: var(--paper-2); }
.links a { display: inline-flex; align-items: center; gap: calc(var(--px) * 2); text-decoration: none; border-bottom: var(--px) solid var(--blaze); }
.links a:hover { background: var(--sun); }
.facts { display: grid; grid-template-columns: repeat(3, auto); gap: 0 calc(var(--px) * 5); justify-content: start; }
.facts dt { font-family: var(--small); font-size: 15px; color: var(--dim); }
.facts dd { grid-row: 2; }
.facts dt:nth-of-type(4) { grid-row: 3; grid-column: 1 / -1; margin-top: calc(var(--px) * 1); }
.facts dd:nth-of-type(4) { grid-row: 4; grid-column: 1 / -1; }
.go { align-self: flex-end; }
.egg { font-family: var(--small); font-size: 15px; color: var(--dim); }
#card[data-kind="sign"] { background: repeating-linear-gradient(0deg, rgba(56, 34, 15, 0) 0 calc(var(--px) * 5), rgba(56, 34, 15, .22) calc(var(--px) * 5) calc(var(--px) * 6)), var(--wood-3); color: var(--routed); box-shadow: inset 0 var(--px) 0 var(--wood-4), inset 0 calc(var(--px) * -1) 0 var(--wood-2), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--shade); }
#card[data-kind="sign"] h2 { font-family: var(--sign); font-size: 24px; text-shadow: 0 var(--px) 0 var(--wood-1); }
#card[data-kind="sign"] .from, #card[data-kind="sign"] .aside, #card[data-kind="sign"] .draft { color: #ecd6a2; border-color: #ecd6a2; }
#card[data-kind="sign"] .rule { background: repeating-linear-gradient(90deg, var(--routed) 0 calc(var(--px) * 2), transparent calc(var(--px) * 2) calc(var(--px) * 4)); }
#card[data-kind="map"] { background: linear-gradient(90deg, transparent calc(33.3% - var(--px)), rgba(44, 32, 48, .1) 33.3%, transparent calc(33.3% + var(--px)), transparent calc(66.6% - var(--px)), rgba(44, 32, 48, .1) 66.6%, transparent calc(66.6% + var(--px))), repeating-radial-gradient(circle at 78% 18%, rgba(70, 122, 48, 0) 0 calc(var(--px) * 5), rgba(70, 122, 48, .2) calc(var(--px) * 5) calc(var(--px) * 6)), var(--paper); }
#card[data-kind="journal"] { background: linear-gradient(90deg, transparent calc(var(--px) * 12), rgba(224, 88, 36, .45) calc(var(--px) * 12), rgba(224, 88, 36, .45) calc(var(--px) * 13), transparent calc(var(--px) * 13)), repeating-linear-gradient(0deg, transparent 0 calc(1.12em - var(--px)), rgba(26, 118, 136, .28) calc(1.12em - var(--px)) 1.12em), var(--paper); padding-left: calc(var(--px) * 16); }
#card[data-kind="watch"] { background: #17241c; color: var(--lcd); border-radius: calc(var(--px) * 4); box-shadow: inset 0 0 0 var(--px) #17241c, inset 0 0 0 calc(var(--px) * 2) #2f4a30, calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--shade); }
#card[data-kind="watch"] .from, #card[data-kind="watch"] .draft { color: #6d8a3a; border-color: #6d8a3a; }
#card[data-kind="watch"] .rule { background: repeating-linear-gradient(90deg, var(--lcd) 0 calc(var(--px) * 2), transparent calc(var(--px) * 2) calc(var(--px) * 4)); }
#card[data-kind="watch"] .tools li { background: none; border-color: var(--lcd); }
.gauges { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--px) * 1) calc(var(--px) * 3); align-items: center; font-family: var(--small); font-size: 15px; }
.gauges i { display: block; height: calc(var(--px) * 3); background: repeating-linear-gradient(90deg, var(--lcd) 0 calc(var(--px) * 2), transparent calc(var(--px) * 2) calc(var(--px) * 3)); }
#card[data-kind="guide"] { padding-right: calc(var(--px) * 26); }
#card[data-kind="guide"]::after { content: ""; position: absolute; right: calc(var(--px) * 7); top: calc(var(--px) * 7); bottom: calc(var(--px) * 7); width: calc(var(--px) * 14); background: linear-gradient(var(--paper-ink), var(--paper-ink)) 50% 100% / var(--px) 100% no-repeat, radial-gradient(circle, var(--blaze) 0 calc(var(--px) * 2), transparent calc(var(--px) * 2)) 50% 12% / calc(var(--px) * 6) calc(var(--px) * 6) no-repeat, radial-gradient(circle, var(--paper-ink) 0 calc(var(--px) * 1.5), transparent calc(var(--px) * 1.5)) 50% 40% / calc(var(--px) * 6) calc(var(--px) * 6) no-repeat, radial-gradient(circle, var(--paper-ink) 0 calc(var(--px) * 1.5), transparent calc(var(--px) * 1.5)) 50% 70% / calc(var(--px) * 6) calc(var(--px) * 6) no-repeat, linear-gradient(var(--paper-ink), var(--paper-ink)) 0 30% / 100% var(--px) no-repeat, var(--paper-2); border: var(--px) solid var(--paper-ink); }

/* Tags hung along the top, and the names pinned on things in the world. */
#top { position: fixed; z-index: 3; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px)); display: flex; gap: calc(var(--px) * 2); pointer-events: none; }
#top .plank { pointer-events: auto; border-top: 0; min-height: calc(var(--px) * 9); padding: calc(var(--px) * 1) calc(var(--px) * 3); font-size: 16px; }
#top .gap { flex: 1; }
.name { position: fixed; z-index: 1; transform: translate(-50%, -100%); padding: 0 calc(var(--px) * 2); font-family: var(--small); font-size: 15px; line-height: 1.2; white-space: nowrap; color: var(--routed); background: var(--wood-2); border: var(--px) solid var(--ink); box-shadow: 0 var(--px) 0 var(--shade); pointer-events: none; }
.name::after { content: ""; position: absolute; left: 50%; top: 100%; width: var(--px); height: calc(var(--px) * 3); margin-left: calc(var(--px) * -.5); background: var(--ink); }
button.name { pointer-events: auto; }
button.name:hover, .name.done { background: var(--moss); }
#toast { position: fixed; z-index: 4; left: 50%; top: calc(var(--px) * 16); transform: translateX(-50%); max-width: calc(100% - 32px); padding: calc(var(--px) * 1) calc(var(--px) * 4); font-size: 20px; background: var(--paper); border: var(--px) solid var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); text-align: center; }

/* The route along the bottom: its profile, a flag at each milestone, a marker for him. */
#bar { position: fixed; z-index: 2; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(var(--px) * 3 + env(safe-area-inset-bottom, 0px)); display: flex; align-items: stretch; gap: calc(var(--px) * 2); }
#bar .plank { justify-content: center; min-width: calc(var(--px) * 26); }
#line { position: relative; flex: 1; min-width: 0; height: calc(var(--px) * 22); cursor: pointer; touch-action: none; background: var(--wood-1); border: var(--px) solid var(--ink); box-shadow: inset 0 var(--px) 0 #1f1208, var(--px) calc(var(--px) * 2) 0 var(--shade); }
#prof { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.mark { position: absolute; bottom: 100%; transform: translateX(-50%); margin-bottom: calc(var(--px) * 1); padding: 0 calc(var(--px) * 2); font-family: var(--small); font-size: 15px; line-height: 1.25; white-space: nowrap; color: var(--paper-ink); background: var(--paper); border: var(--px) solid var(--ink); pointer-events: none; }
.mark.passed { background: var(--sun); }
.mark.first { transform: none; }
.mark.last { transform: translateX(-100%); }
#status { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--wood-2); color: var(--routed); font-family: var(--sign); font-size: 20px; padding: 16px; text-align: center; }

/* The sheets that open over the world: the trail map, the kiosk, the register, the keys, the plain page. */
#sheet { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: calc(var(--px) * 6); background: rgba(26, 20, 36, .55); overflow: auto; }
#sheet > section { position: relative; width: min(980px, 100%); max-height: 100%; overflow: auto; }
.band { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: calc(var(--px) * -5) calc(var(--px) * -6) calc(var(--px) * 4); padding: calc(var(--px) * 3) calc(var(--px) * 6); background: var(--ink); color: var(--paper); }
.band h2 { font-size: 30px; }
.band p { color: #c8bfae; text-align: right; }
#close { position: sticky; float: right; top: 0; z-index: 2; margin: calc(var(--px) * -2) calc(var(--px) * -3) 0 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: calc(var(--px) * 6); align-items: start; }
.mapbox { position: relative; border: var(--px) solid var(--ink); line-height: 0; background: #58993c; }
.mapbox canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.dot { position: absolute; width: calc(var(--px) * 5); height: calc(var(--px) * 5); margin: calc(var(--px) * -2.5); background: var(--blaze); border: var(--px) solid var(--ink); box-shadow: 0 0 0 var(--px) var(--paper); }
.dot:hover, .dot:focus-visible { background: var(--sun); z-index: 2; }
.dot span { position: absolute; left: 50%; bottom: calc(100% + var(--px) * 2); transform: translateX(-50%); padding: 0 calc(var(--px) * 2); font-family: var(--small); font-size: 15px; line-height: 1.25; white-space: nowrap; background: var(--paper); border: var(--px) solid var(--ink); display: none; }
.dot:hover span, .dot:focus-visible span, .dot.big span { display: block; }
.dot.big { width: calc(var(--px) * 7); height: calc(var(--px) * 7); margin: calc(var(--px) * -3.5); background: var(--sun); }
.key { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--px) * 5); margin-top: calc(var(--px) * 5); }
.key h3 { font-size: 30px; line-height: 1; }
.key small { display: block; font-family: var(--small); font-size: 15px; color: var(--dim); margin-bottom: calc(var(--px) * 2); }
.key li { display: flex; align-items: baseline; gap: calc(var(--px) * 2); }
.key li::before { content: ""; flex: none; width: calc(var(--px) * 2); height: calc(var(--px) * 2); background: var(--blaze); box-shadow: 0 0 0 var(--px) var(--ink); transform: translateY(calc(var(--px) * -1)); margin-left: var(--px); }
.key button { border-bottom: var(--px) solid transparent; }
.key button:hover, .key button:focus-visible { border-bottom-color: var(--blaze); }
.side { display: flex; flex-direction: column; gap: calc(var(--px) * 2); }
.side h3 { font-size: 30px; line-height: 1; margin-top: calc(var(--px) * 2); }
.side .plank { width: 100%; }
.legend { font-family: var(--small); font-size: 15px; line-height: 1.3; color: var(--dim); }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: calc(var(--px) * 4); }
.board > div { padding: calc(var(--px) * 3) calc(var(--px) * 4); background: var(--paper-2); border: var(--px) solid var(--paper-ink); transform: rotate(-.6deg); }
.board > div:nth-child(even) { transform: rotate(.7deg); }
.board dt { font-family: var(--small); font-size: 15px; color: var(--dim); }
.board dd { font-family: var(--title); font-size: 30px; line-height: 1; }
.open { color: var(--moss); }
.entries { display: flex; flex-direction: column; gap: calc(var(--px) * 3); margin-bottom: calc(var(--px) * 5); }
.entries li { padding-bottom: calc(var(--px) * 2); border-bottom: var(--px) dashed rgba(44, 32, 48, .4); }
.entries b { font-size: 30px; line-height: 1; margin-right: calc(var(--px) * 3); }
.entries time, .pending { font-family: var(--small); font-size: 15px; color: var(--dim); }
form { display: grid; gap: calc(var(--px) * 2); max-width: 520px; }
label { font-family: var(--small); font-size: 15px; color: var(--dim); }
input, textarea { font: inherit; color: var(--paper-ink); background: #fffcee; border: var(--px) solid var(--paper-ink); padding: calc(var(--px) * 1) calc(var(--px) * 2); width: 100%; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--px) * 2) calc(var(--px) * 5); }
.keys dt { font-family: var(--sign); font-size: 16px; }
#plain { position: fixed; inset: 0; z-index: 7; overflow: auto; background: var(--paper); padding: 0 0 80px; }
#plain .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
#plain .band { margin: 0 0 20px; position: sticky; top: 0; z-index: 1; }
#plain canvas { width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; border: var(--px) solid var(--ink); }
#plain h1 { font-size: 45px; line-height: 1; }
#plain h3 { font-size: 30px; margin-top: 26px; padding-bottom: 4px; border-bottom: var(--px) solid var(--ink); }
#plain h4 { font-family: var(--read); font-size: 20px; color: var(--blaze); margin: 12px 0 0; }
#plain .links { margin-top: 4px; }

@media (max-width: 760px) {
  #fork, #card { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; }
  #card { max-height: 50%; }
  .mark { display: none; }
  .cols { grid-template-columns: 1fr; }
  .key { grid-template-columns: 1fr; }
  #top .plank { padding: calc(var(--px) * 1) calc(var(--px) * 3); }
  #b-help, #b-track { display: none; }
  .name { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<canvas id="c" aria-label="A pixel-art mountain world: a runner at a trail junction in a wildflower meadow, with a lake, a granite wall and a glaciated massif beyond"></canvas>
<div id="status" role="status">Drawing the world</div>

<header id="top" hidden>
  <button class="plank" id="b-map" aria-haspopup="dialog">Trail map</button>
  <span class="gap"></span>
  <button class="plank" id="b-track" aria-label="Next music track"><i class="note"></i><span></span></button>
  <button class="plank" id="b-sound" aria-pressed="false">Sound off</button>
  <button class="plank" id="b-dusk">Dusk</button>
  <button class="plank" id="b-help" aria-label="Keys">Keys</button>
</header>

<section id="fork" hidden>
  <div class="placard">
    <h1>TJ Zimmerman</h1>
    <p id="intro"></p>
  </div>

</section>
