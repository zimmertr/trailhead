# Every response, errors included (`always`). nginx drops a server's
# add_header lines in any location with one of its own, so each such location
# includes this file again. The policy lists exactly what the pages load:
# their own scripts, styles, fonts and images, and requests back to this site.
# tests/csp.test.ts fails a host in web/src that this policy doesn't classify.
# HSTS is set at the edge, where TLS ends.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
